name: DE completion
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gbr_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: gbr_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbr_ci -d gbr_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: gbr_ci
      PGPASSWORD: ci_only
      PGDATABASE: gbr_ci_test
      GBR_RUN_DB_TESTS: '1'
      GBR_CI_FIXTURE_DB: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-de.txt
      - name: Prepare isolated database
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg
          with psycopg.connect(autocommit=True) as conn:
              for name in ['001_core_schema.sql', '002_requirement_processing.sql', '003_canonical_requirements.sql', '004_split_requirements.sql']:
                  with conn.transaction():
                      conn.execute((Path('warehouse/ddl') / name).read_text())
          PY
      - run: python -m pytest tests/test_requirement_loader.py tests/test_canonical_requirements.py tests/test_review_importer.py tests/test_de_completion.py -v --junitxml=reports/de_ci_tests.xml
      - run: python tests/seed_dbt_ci.py
      - run: dbt build --project-dir dbt_gbr --profiles-dir dbt_gbr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: de-test-results
          path: |
            reports/de_ci_tests.xml
            dbt_gbr/target/run_results.json
