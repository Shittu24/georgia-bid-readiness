name: Pipeline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gbr_test
          POSTGRES_PASSWORD: temporary_ci_password
          POSTGRES_DB: gbr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gbr_test -d gbr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: gbr_test
      PGPASSWORD: temporary_ci_password
      PGDATABASE: gbr_test
      GBR_RUN_DB_TESTS: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check package dependencies
        run: python -m pip check

      - name: Create schema in temporary database
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          schema = Path(
              "warehouse/ddl/001_core_schema.sql"
          ).read_text(encoding="utf-8")

          with psycopg.connect("") as connection:
              with connection.cursor() as cursor:
                  cursor.execute(schema)
          PY

      - name: Run pipeline tests
        run: python -m pytest tests/test_pipeline.py -v
