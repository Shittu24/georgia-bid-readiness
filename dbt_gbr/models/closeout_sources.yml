    columns:
      - name: assertion_key
        tests: [unique, not_null]
  - name: fct_split_parent_resolution
    columns:
      - name: candidate_id
        tests: [unique, not_null]
  - name: mart_de_closeout
    columns:
      - name: solicitation_id
        tests: [unique, not_null]
